# 推送到 main → 无头 Godot 4.7.2 跑测试 → 用仓库里的瘦身模板导出 Web（单线程，无需 COOP/COEP）→ 发布到 GitHub Pages
name: 测试并发布到 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux
      - name: 下载 Godot ${{ env.GODOT_VERSION }}（官方 release，固定版本）
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
      - name: 导入资源
        run: ~/godot/godot --headless --path . --import || true
      - name: 规则测试
        run: |
          timeout 300 ~/godot/godot --headless --path . -s res://tests/run_tests.gd | tee /tmp/t.txt
          grep -q "，0 失败" /tmp/t.txt
      - name: 江湖（说书人）指标
        run: |
          timeout 300 ~/godot/godot --headless --path . -s res://tests/world_test.gd | tee /tmp/w.txt
          grep -q "江湖测试：0 失败" /tmp/w.txt
      - name: UI 冒烟
        run: |
          timeout 300 ~/godot/godot --headless --path . -s res://tests/ui_smoke.gd >/dev/null 2>&1 || true
          tail -3 tests/ui_smoke_results.txt
          grep -q "UI 冒烟：PASS" tests/ui_smoke_results.txt
      - name: 乱点试玩（3 个种子，查死局/卡住）
        run: |
          timeout 300 ~/godot/godot --headless --path . -s res://tests/play_random.gd | tee /tmp/r.txt
          grep -q "乱点试玩：0 失败" /tmp/r.txt
      - name: 导出 Web（玩家版，用 export/templates 里的瘦身模板，不需要官方模板包）
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck
          mkdir -p build/web/audio && cp web_audio/*.ogg build/web/audio/
          mkdir -p build/web/portrait && cp -r web_portrait/. build/web/portrait/ && rm -rf build/web/portrait/.gdignore build/web/portrait/feat
          touch build/web/.nojekyll
          ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  # 连着推两次时，旧运行里的 deploy-pages 会被 Pages 取消，动作却打出
  # error「Deployment cancelled.」，整次工作流记成失败并发出红叉通知。
  # 部署前先看本提交是不是 main 尖端，不是就跳过 deploy（成功，不失败）。
  # 动作失败后再看一次：被后来的提交顶掉就算成功；仍是尖端才真失败。
  # 上面的 concurrency 不动：过时的构建仍会被取消，那种结束状态是 cancelled，不发失败通知。
  tip:
    name: 确认仍是 main 尖端
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: 对照 main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TIP="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          if [ -z "${TIP}" ] || [ "${TIP}" = "null" ]; then
            echo "::error::读不到 main 的尖端提交"
            exit 1
          fi
          echo "tip=${TIP}" >> "$GITHUB_OUTPUT"
          if [ "${TIP}" = "${HEAD_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "本提交 ${HEAD_SHA} 仍是 main 尖端，继续部署。"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main 已到 ${TIP}，本提交 ${HEAD_SHA} 不再部署。"
          fi
  deploy:
    needs: tip
    if: success() && needs.tip.outputs.current == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: 发布到 GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 被后来的提交顶掉则不算失败
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TIP="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          if [ -z "${TIP}" ] || [ "${TIP}" = "null" ]; then
            echo "::error::部署失败，而且读不到 main 的尖端提交"
            exit 1
          fi
          echo "main 尖端=${TIP} 本提交=${HEAD_SHA}"
          if [ "${TIP}" = "${HEAD_SHA}" ]; then
            echo "::error::部署失败，且 ${HEAD_SHA} 仍是 main 尖端。"
            exit 1
          fi
          echo "main 已到 ${TIP}。这次部署被后来的提交顶掉，按成功结束。"
